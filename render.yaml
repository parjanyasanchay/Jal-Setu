# =========================================================================
# Render Blueprint Specification for Jal Setu (Permanent Cloud Deployment)
# Deploys:
# 1. Managed PostgreSQL Database (PostGIS-ready)
# 2. Unified Web Service (FastAPI + React Frontend in Docker)
# =========================================================================

databases:
  - name: jalsetu-db
    databaseName: jalsetu
    user: jalsetu
    plan: free # Change to starter for high-availability production workloads
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: jalsetu-mvp
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free # Change to starter to attach persistent storage disk
    region: oregon
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jalsetu-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        value: "*"

      - key: ALLOWED_ORIGINS
        value: "*"

      - key: PUBLIC_BASE_URL
        sync: false

      - key: LLM_PROVIDER
        value: "ollama"

      - key: LLM_API_KEY
        sync: false

      - key: UPLOAD_DIR
        value: "/app/uploads/evidence"

    # Optional: Attach persistent disk on paid Render plans to persist photo uploads across restarts
    # disk:
    #   name: jalsetu-uploads
    #   mountPath: /app/uploads/evidence
    #   sizeGB: 1
